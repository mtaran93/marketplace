; Pool overrides shared by dev and prod. Loaded after zz-docker.conf (alphabetical include).
[www]
; Worker-side bound on a single request. Nginx gives up at fastcgi_read_timeout 30s (504),
; but without this the FPM worker keeps waiting, e.g. on a Postgres socket after a network
; partition mid-query (statement_timeout is server-side and cannot help). FPM then SIGTERMs
; the worker; Postgres rolls back any open transaction when the connection drops.
; Keep it slightly above fastcgi_read_timeout. Long-running work belongs in the queue.
request_terminate_timeout = 35s
