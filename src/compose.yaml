# Development stack. Run commands from the repository root (../compose.yaml includes this file).
# Values come from src/.env (copy src/.env.example). No secrets live in this file.
name: ${COMPOSE_PROJECT_NAME:-marketplace}

services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    # Per-project name so two checkouts on one host don't overwrite each other's image.
    image: ${COMPOSE_PROJECT_NAME:-marketplace}-app:dev
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_signal: SIGQUIT   # php-fpm: graceful shutdown

  web:
    image: nginx:1.30.6-alpine
    ports:
      # The ONLY published port. Bound to loopback; override WEB_PORT per checkout.
      - "127.0.0.1:${WEB_PORT:-8083}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: postgres:18.7-alpine3.24
    environment:
      POSTGRES_DB: ${DB_DATABASE:?set DB_DATABASE in .env}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/...
      - pgdata:/var/lib/postgresql
      - ./.docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    ports:
      # For DataGrip etc. on this machine: localhost:${DB_FORWARD_PORT}.
      # Loopback only and hardcoded on purpose - never 0.0.0.0 (Docker bypasses ufw).
      - "127.0.0.1:${DB_FORWARD_PORT:-5435}:5432"

  redis:
    image: redis:8.10.3-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      # Lets `redis-cli` inside the container authenticate without -a on the command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
